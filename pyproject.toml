[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exactattn"
version = "0.0.1"
description = "Attention that is bit-identical across splits, batches, draft trees and hardware, by definition."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mpmath>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
